const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
let sb = null;

function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}

function webDb(client) {
  const listeners = new Set();
  const jsonField = (f) => `data->>${f}`;
  async function run(l) {
    let req = client.from("docs").select("id,data").eq("collection", l.coll);
    if (l.id) req = req.eq("id", l.id);
    for (const [f, v] of l.filters) req = req.eq(jsonField(f), v);
    if (l.order) req = req.order(jsonField(l.order[0]), { ascending: l.order[1] !== "desc" });
    if (l.lim) req = req.limit(l.lim);
    const { data, error } = await req;
    if (error) { l.err && l.err(error); return; }
    if (l.id) { const row = data[0]; l.cb({ exists: !!row, data: () => row && row.data }); }
    else l.cb({ docs: data.map((r) => ({ id: r.id, data: () => r.data })) });
  }
  let pending = new Set(), timer = null;
  function refresh(coll) {
    pending.add(coll || "*");
    clearTimeout(timer);
    timer = setTimeout(() => { const p = pending; pending = new Set(); listeners.forEach((l) => { if (p.has("*") || p.has(l.coll)) run(l); }); }, 150);
  }
  client.channel("docs").on("postgres_changes", { event: "*", schema: "public", table: "docs" },
    (m) => refresh((m.new && m.new.collection) || (m.old && m.old.collection))).subscribe();
  // phones drop the live connection in the background, so catch up when the app comes back
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh("*"); });
  window.addEventListener("online", () => refresh("*"));
  const listen = (l) => { listeners.add(l); run(l); return () => listeners.delete(l); };
  function coll(name, filters = [], order = null, lim = null) {
    return {
      where: (f, op, v) => coll(name, [...filters, [f, v]], order, lim),
      orderBy: (f, dir) => coll(name, filters, [f, dir], lim),
      limit: (n) => coll(name, filters, order, n),
      onSnapshot: (cb, err) => listen({ coll: name, filters, order, lim, cb, err }),
      add: async (d) => {
        const { error } = await client.from("docs").insert({ collection: name, id: crypto.randomUUID(), data: d });
        if (error) throw error; refresh(name);
      },
    };
  }
  function doc(path) {
    const [c, id] = path.split("/");
    return {
      onSnapshot: (cb, err) => listen({ coll: c, id, filters: [], cb, err }),
      update: async (u) => {
        const { data, error } = await client.from("docs").select("data").eq("collection", c).eq("id", id).maybeSingle();
        if (error || !data) throw error || new Error("not found");
        const res = await client.from("docs").update({ data: { ...data.data, ...u } }).eq("collection", c).eq("id", id);
        if (res.error) throw res.error; refresh(c);
      },
      set: async (d) => { const { error } = await client.from("docs").upsert({ collection: c, id, data: d }, { onConflict: "collection,id" }); if (error) throw error; refresh(c); },
      delete: async () => { const { error } = await client.from("docs").delete().eq("collection", c).eq("id", id); if (error) throw error; refresh(c); },
    };
  }
  return { collection: (n) => coll(n), doc };
}

async function openDb() {
  if (window.claude && window.claude.use) return window.claude.use("db");
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) return null;
  // arriving from the emailed sign-in link (first time, or forgot password): ask for a password before the app
  const fromLink = /type=(magiclink|recovery|signup|invite)/.test(location.hash) || /[?&]code=/.test(location.search);
  await loadScript(SUPABASE_JS);
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const { data } = await sb.auth.getSession();
  if (!data.session) { state.status = "signin"; return null; }
  if (fromLink) { state.status = "signin"; state.signin = "setpw"; return null; }
  return webDb(sb);
}

// Sign-in (web app): email + password. The free Supabase plan can't change its email text, so the standard
// sign-in-link email is used once, to set the password (and again if it's forgotten). On iPhone, the installed
// app keeps its own login, separate from Safari: set the password via the link, then sign in inside the app.
function renderSignin() {
  const email = esc(state.signinEmail || CFG.ownerEmail || "");
  if (state.signin === "setpw") return `<div class="state signin"><h2>Choose a password</h2>
    <p>You're signed in from the email link. Pick a password (10+ characters) to sign in to the app from now on.</p>
    <form id="signin" data-mode="setpw"><input id="pw1" type="password" autocomplete="new-password" minlength="10" placeholder="New password" aria-label="New password" required>
    <input id="pw2" type="password" autocomplete="new-password" minlength="10" placeholder="Same again" aria-label="Repeat new password" required><button type="submit">Save</button></form></div>`;
  if (state.signin === "sent") return `<div class="state signin"><h2>Check your email</h2>
    <p>We sent a sign-in link to <b>${email}</b>. Open it, choose a password, then come back here and sign in.</p>
    <button class="addlink" data-act="signin-restart">Back to sign in</button></div>`;
  return `<div class="state signin"><h2>Sign in</h2><p>Your second brain is private.</p>
    <form id="signin" data-mode="password"><input id="signin-email" type="email" autocomplete="username" value="${email}" aria-label="Email" required>
    <input id="signin-pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button type="submit">Sign in</button></form>
    <button class="addlink" data-act="signin-link">First time, or forgot your password? Email me a sign-in link</button></div>`;
}

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "signin" || !sb) return;
  e.preventDefault();
  const mode = e.target.dataset.mode;
  if (mode === "password") {
    state.signinEmail = $("signin-email").value.trim();
    const { error } = await sb.auth.signInWithPassword({ email: state.signinEmail, password: $("signin-pw").value });
    if (error) { toast(/confirm/i.test(error.message) ? "Confirm your email first." : "Email or password didn't match. Use the email link to set a new one."); return; }
    location.replace(location.pathname);
  } else if (mode === "setpw") {
    const a = $("pw1").value, b = $("pw2").value;
    if (a !== b) { toast("The two passwords don't match."); return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { toast(/short|least/i.test(error.message) ? "Use at least 10 characters." : "Couldn't save the password. Try again."); return; }
    toast("Password saved."); setTimeout(() => location.replace(location.pathname), 600);
  }
});

async function sendSigninLink() {
  const el = $("signin-email");
  state.signinEmail = (el && el.value.trim()) || state.signinEmail || CFG.ownerEmail || "";
  const { error } = await sb.auth.signInWithOtp({ email: state.signinEmail, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  if (error) { toast(/rate|seconds/i.test(error.message) ? "Too many emails asked for. Wait a minute and try again." : "Couldn't send the link. Check the email address."); return; }
  state.signin = "sent"; render();
}

podInitPlayer();
render();
openDb().then((db) => {
  if (!db) { if (state.status !== "signin") state.status = "nodb"; render(); return; }
  state.db = db;
  db.collection("people").onSnapshot(
    (snap) => { state.people = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (state.tab === "network" || isDesk()) render(); else { renderHeader(); renderSide(); } },
    () => toast("Couldn't load your network. Reload to try again.")
  );
  db.collection("companies").onSnapshot(
    (snap) => { state.companies = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (state.tab === "companies" || isDesk()) render(); },
    () => toast("Couldn't load your companies. Reload to try again.")
  );
  db.collection("news").orderBy("date", "desc").limit(30).onSnapshot(
    (snap) => {
      state.news = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!state.news.some((n) => n.id === state.newsId)) state.newsId = (state.news[0] || {}).id || null;
      if (state.tab === "news" || isDesk()) render();
    },
    () => toast("Couldn't load your news. Reload to try again.")
  );
  db.collection("explained").orderBy("date", "desc").limit(30).onSnapshot(
    (snap) => { state.explained = Object.fromEntries(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }])); if (state.tab === "news" && !isDesk()) render(); },
    () => toast("Couldn't load your explained stories. Reload to try again.")
  );
  db.doc("meta/storylines").onSnapshot((d) => { state.storylines = d.exists ? d.data() : null; render(); }, () => {});
  db.doc("meta/glossary").onSnapshot((d) => { state.glossary = d.exists ? d.data() : null; if (isDesk()) render(); }, () => {});
  db.doc("meta/companies").onSnapshot((d) => { state.coMeta = d.exists ? d.data() : null; if (state.tab === "companies" || isDesk()) render(); }, () => {});
  db.doc("meta/network").onSnapshot((d) => { state.netMeta = d.exists ? d.data() : null; if (state.tab === "network" || isDesk()) render(); }, () => {});
  db.collection("calls").onSnapshot(
    (snap) => { state.calls = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (isDesk()) render(); else renderSide(); },
    () => toast("Couldn't load your calls. Reload to try again.")
  );
  db.collection("questions").onSnapshot(
    (snap) => { state.questions = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (isDesk()) render(); else renderSide(); },
    () => toast("Couldn't load your research questions. Reload to try again.")
  );
  if (sb) { // Ghostwriter drafts and the courier's status (web app only, D-035)
    db.collection("drafts").onSnapshot((snap) => { state.drafts = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
    db.doc("meta/courier").onSnapshot((d) => { state.courier = d.exists ? d.data() : null; render(); }, () => {});
    db.doc("meta/inbox_check").onSnapshot((d) => { state.inboxCheck = d.exists ? d.data() : null; render(); }, () => {});
    // Podcasts (D-044): episodes, listening progress (its own collection, so playing doesn't redraw everything) and the Mac's status
    db.collection("podcasts").onSnapshot((snap) => { state.pods = snap.docs.map((d) => ({ id: d.id, ...d.data() })); podUpdateBar(); render(); }, () => {});
    db.collection("podprogress").onSnapshot((snap) => { state.podProg = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); if (state.tab === "podcasts" && !isDesk()) render(); }, () => {});
    db.doc("meta/podcasts").onSnapshot((d) => { state.podMeta = d.exists ? d.data() : null; if (state.tab === "podcasts" || isDesk()) render(); }, () => {});
    setInterval(() => { if (state.tab === "podcasts" && podLive().some((p) => POD_MAKING.includes(p.status))) render(); }, 30000);
    // GitHub Scout (D-051): picks, and the Mac's scan status
    db.collection("scout").onSnapshot((snap) => { state.scout = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (state.tab === "github" || isDesk()) render(); else renderSide(); }, () => {});
    db.doc("meta/scout").onSnapshot((d) => { state.scoutMeta = d.exists ? d.data() : null; if (state.tab === "github" || isDesk()) render(); else renderSide(); }, () => {});
    db.doc("meta/waiting").onSnapshot((d) => { state.waiting = d.exists ? d.data() : null; if (state.tab === "emails" || state.tab === "network") render(); }, () => {});
  }
  db.collection("coursework").onSnapshot((snap) => { state.cw = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  db.collection("announcements").onSnapshot((snap) => { state.ann = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (state.tab === "coursework" || isDesk()) render(); }, () => {});
  db.doc("meta/canvas").onSnapshot((d) => { state.canvas = d.exists ? d.data() : null; if (state.tab === "coursework" || isDesk()) render(); }, () => {});
  db.doc("meta/refresh").onSnapshot((d) => { state.refresh = d.exists ? d.data() : null; render(); }, () => {});
  db.collection("briefs").onSnapshot((snap) => { state.briefs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  db.collection("comments").onSnapshot((snap) => { state.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  db.collection("suggestions").where("status", "==", "pending").onSnapshot(
    (snap) => { state.suggestions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "") || (a.order ?? 0) - (b.order ?? 0)); render(); },
    () => {}
  );
  // keep "Waiting for your Mac" and the step line current
  setInterval(() => { const r = state.refresh; if (r && (r.status === "requested" || r.status === "running")) render(); }, 30000);
  db.doc("meta/learning").onSnapshot((d) => { state.learning = d.exists ? d.data() : null; if (isDesk()) render(); }, () => {});
  db.doc("meta/thinking").onSnapshot((d) => { state.thinking = d.exists ? d.data() : null; if (isDesk()) render(); }, () => {});
  db.collection("days").orderBy("date", "desc").limit(60).onSnapshot(
    (snap) => {
      state.days = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      state.status = "ready";
      if (!state.dayId || !state.days.some((d) => d.id === state.dayId)) selectDay(pickDefault());
      else render();
    },
    () => { state.status = "nodb"; render(); }
  );
}).catch(() => { state.status = "nodb"; state.connectFailed = true; render(); });
// web app only: an offline helper so the app opens on a weak signal
if ("serviceWorker" in navigator && !(window.claude && window.claude.use) && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
